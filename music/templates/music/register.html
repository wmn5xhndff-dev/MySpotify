{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — MySpotify</title>
    <link rel="stylesheet" href="{% static 'music/style.css' %}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <a href="{% url 'home' %}" class="logo">MySpotify</a>
        <h2>Создать аккаунт</h2>

        {% if messages %}
        <ul class="messages-list">
            {% for msg in messages %}<li>{{ msg }}</li>{% endfor %}
        </ul>
        {% endif %}

        <form method="post" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" name="username" placeholder="username" autofocus required>
            </div>
            <div class="form-group">
                <label>Email (необязательно)</label>
                <input type="email" name="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password1" placeholder="Минимум 8 символов" required>
            </div>
            <div class="form-group">
                <label>Повторите пароль</label>
                <input type="password" name="password2" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-full">Зарегистрироваться</button>
        </form>

        <div class="auth-footer">
            Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
        </div>
    </div>
</div>
</body>
</html>
