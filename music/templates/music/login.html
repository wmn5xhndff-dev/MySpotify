{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти — MySpotify</title>
    <link rel="stylesheet" href="{% static 'music/style.css' %}">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <a href="{% url 'home' %}" class="logo">MySpotify</a>
        <h2>Добро пожаловать</h2>

        {% if messages %}
        <ul class="messages-list">
            {% for msg in messages %}<li>{{ msg }}</li>{% endfor %}
        </ul>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" name="username" placeholder="username" autofocus required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn-full">Войти</button>
        </form>

        <div class="auth-footer">
            Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйся</a>
        </div>
    </div>
</div>
</body>
</html>
